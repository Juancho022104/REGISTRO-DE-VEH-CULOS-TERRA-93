<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Segoe UI,Arial,sans-serif;
background:#f3f6f8;
color:#1f2937;
}

.container{
width:95%;
max-width:900px;
margin:30px auto;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h1{
color:#1E3530;
font-size:28px;
margin-bottom:5px;
}

h2{
color:#1E3530;
margin-bottom:10px;
font-size:19px;
}

h3{
color:#64748b;
font-weight:normal;
margin-bottom:25px;
}

.card{
background:#fafafa;
border:1px solid #dbe4ea;
border-radius:12px;
padding:25px;
margin-bottom:20px;
}

.card p.subtitulo{
color:#64748b;
font-size:13px;
margin-bottom:18px;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.form-group{
display:flex;
flex-direction:column;
}

.form-group.full{
grid-column:1/3;
}

label{
font-weight:bold;
margin-bottom:6px;
color:#334155;
font-size:14px;
}

label.opcion{
font-weight:normal;
display:flex;
align-items:center;
gap:8px;
margin-bottom:8px;
color:#334155;
}

input,select,textarea{
width:100%;
padding:11px;
border:1px solid #cbd5e1;
border-radius:8px;
font-size:14px;
background:white;
}

input[type=checkbox],input[type=radio]{
width:auto;
}

textarea{
height:80px;
resize:none;
}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:#1E3530;
box-shadow:0 0 0 3px rgba(30,53,48,.15);
}

.opciones-radio{
display:flex;
flex-wrap:wrap;
gap:16px;
padding:11px 0;
}

.anexo-item{
border:1px solid #dbe4ea;
border-radius:10px;
padding:14px;
background:white;
margin-bottom:12px;
}

.anexo-item label{
margin-bottom:8px;
}

.anexo-item small{
display:block;
color:#94a3b8;
margin-top:5px;
}

.consentimiento{
display:flex;
align-items:flex-start;
gap:10px;
margin-bottom:14px;
font-size:13px;
color:#334155;
line-height:1.5;
}

.consentimiento input{
width:auto;
margin-top:3px;
}

.canvas-box{
border:1px solid #cbd5e1;
border-radius:10px;
padding:10px;
background:white;
}

canvas{
width:100%;
height:130px;
border:1px dashed #94a3b8;
background:#fafafa;
border-radius:8px;
}

button{
border:none;
padding:13px 22px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:bold;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.btn-guardar{
margin-top:5px;
background:#2563eb;
color:white;
width:100%;
}

.btn-guardar:hover{
background:#1d4ed8;
}

.btn-borrar-firma{
background:#e2e8f0;
color:#334155;
margin-top:8px;
padding:8px 14px;
font-size:13px;
}

@media(max-width:850px){

.form-grid{
grid-template-columns:1fr;
}

.form-group.full{
grid-column:auto;
}

.container{
width:95%;
padding:20px;
}

}
</style>
