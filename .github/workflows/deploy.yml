name: Deploy a Apps Script

on:
  push:
    branches:
      - main

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Configurar credenciales de clasp
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Subir proyecto a Apps Script
        run: clasp push --force

      - name: DIAGNOSTICO TEMPORAL - Verificar respuesta real del /exec
        run: |
          URL="https://script.google.com/macros/s/AKfycbxX7HUpwllwmCswSmZXW_HXCE4Yk78giBdMjZCvFcnKGFt5eyx4rAHrpaDpH_AqqQPDRA/exec"
          curl -sL "$URL" -o /tmp/respuesta.html
          echo "TAMAÑO EN BYTES:"
          wc -c /tmp/respuesta.html
          echo "----- CONTIENE 'FIN JS'? -----"
          grep -c "FIN JS" /tmp/respuesta.html || echo "NO ENCONTRADO"
          echo "----- CONTIENE '</html>' AL FINAL? -----"
          tail -c 300 /tmp/respuesta.html
          echo ""
          echo "----- BUSCANDO 'createOAuthDialog' -----"
          grep -o "createOAuthDialog[^\"]*" /tmp/respuesta.html || echo "NO ENCONTRADO"
