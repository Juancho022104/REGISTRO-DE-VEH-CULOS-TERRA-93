name: Deploy a Apps Script

on:
  push:
    branches:
      - main

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Configurar credenciales de clasp
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Subir proyecto a Apps Script
        run: clasp push --force

      - name: DIAGNOSTICO TEMPORAL - Verificar respuesta real del /exec
        run: |
          URL="https://script.google.com/macros/s/AKfycbxX7HUpwllwmCswSmZXW_HXCE4Yk78giBdMjZCvFcnKGFt5eyx4rAHrpaDpH_AqqQPDRA/exec"
          curl -sL "$URL" -o /tmp/respuesta.html
          echo "TAMAÑO EN BYTES:"
          wc -c /tmp/respuesta.html
          echo "----- MARCADORES ENCONTRADOS -----"
          for marca in "anexoTarjetaPropiedad" "anexoSoat" "anexoTecnomecanica" "anexoCertificacionElectrica" "anexoCartaAutorizacion" "anexoCompromisoReglamento" "aceptaHabeasData" "aceptaReglamento" "iniciarFirma" "FIN JS"; do
            if grep -q "$marca" /tmp/respuesta.html; then
              echo "SI  -> $marca"
            else
              echo "NO  -> $marca"
            fi
          done
          echo "----- LONGITUD DEL CAMPO userHtml (aprox, en caracteres escapados) -----"
          grep -o '\\x22userHtml\\x22:\\x22.*\\x22,\\x22ncc\\x22' /tmp/respuesta.html | wc -c
          echo "----- ULTIMOS 400 CARACTERES DEL BLOQUE userHtml -----"
          python3 -c "
data = open('/tmp/respuesta.html', encoding='utf-8', errors='replace').read()
start = data.find('userHtml')
end = data.find('\"ncc\"')
if start != -1 and end != -1:
    snippet = data[start:end]
    print('LONGITUD DEL BLOQUE userHtml (caracteres):', len(snippet))
    print('ULTIMOS 400 CARACTERES:')
    print(snippet[-400:])
else:
    print('NO SE ENCONTRO EL BLOQUE userHtml')
"
