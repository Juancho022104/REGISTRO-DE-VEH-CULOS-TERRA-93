//================================================
// MOSTRAR / OCULTAR OBLIGATORIEDAD CARTA AUTORIZACIÓN
//================================================

function actualizarCartaAutorizacion() {
  var calidad = document.getElementById("calidad").value;
  var item = document.getElementById("itemCartaAutorizacion");

  if (!item) {
    return;
  }

  item.style.borderColor = calidad === "Arrendatario / Tenedor" ? "#f59e0b" : "#dbe4ea";
}

//================================================
// VALIDACIÓN DE CORREO (cliente)
//================================================

function correoValido(correo) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
}

//================================================
// FIRMA DIGITAL CANVAS
//================================================

let canvasFirma;
let ctxFirma;
let firmaTrazada = false;

function iniciarFirma() {
  canvasFirma = document.getElementById("firma");

  if (!canvasFirma) {
    return;
  }

  firmaTrazada = false;

  let ancho = canvasFirma.parentElement.offsetWidth;
  canvasFirma.width = ancho;
  canvasFirma.height = 130;

  ctxFirma = canvasFirma.getContext("2d");
  ctxFirma.strokeStyle = "#000";

  let dibujando = false;

  function posicion(e) {
    let rect = canvasFirma.getBoundingClientRect();

    if (e.touches) {
      return {
        x: e.touches[0].clientX - rect.left,
        y: e.touches[0].clientY - rect.top
      };
    }

    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function iniciar(e) {
    e.preventDefault();
    dibujando = true;
    firmaTrazada = true;

    let pos = posicion(e);
    ctxFirma.beginPath();
    ctxFirma.moveTo(pos.x, pos.y);
  }

  function dibujar(e) {
    if (!dibujando) {
      return;
    }

    e.preventDefault();

    let pos = posicion(e);

    ctxFirma.lineWidth = 2;
    ctxFirma.lineCap = "round";
    ctxFirma.lineJoin = "round";

    ctxFirma.lineTo(pos.x, pos.y);
    ctxFirma.stroke();
  }

  function terminar() {
    dibujando = false;
  }

  canvasFirma.addEventListener("mousedown", iniciar);
  canvasFirma.addEventListener("mousemove", dibujar);
  canvasFirma.addEventListener("mouseup", terminar);
  canvasFirma.addEventListener("mouseleave", terminar);

  canvasFirma.addEventListener("touchstart", iniciar, { passive: false });
  canvasFirma.addEventListener("touchmove", dibujar, { passive: false });
  canvasFirma.addEventListener("touchend", terminar);
}

function limpiarFirma() {
  if (ctxFirma) {
    ctxFirma.clearRect(0, 0, canvasFirma.width, canvasFirma.height);
    firmaTrazada = false;
  }
}

//================================================
// CONVERTIR ARCHIVO A BASE64
//================================================

function convertirArchivoBase64(input) {
  return new Promise(function (resolve) {
    if (!input || !input.files || input.files.length === 0) {
      resolve("");
      return;
    }

    let lector = new FileReader();

    lector.onload = function (e) {
      resolve(e.target.result);
    };

    lector.onerror = function () {
      resolve("");
    };

    lector.readAsDataURL(input.files[0]);
  });
}

//================================================
// GUARDAR SOLICITUD
//================================================

function registrarVehiculoForm() {
  let datos = {
    nombreTitular: document.getElementById("nombreTitular").value.trim(),
    cedulaTitular: document.getElementById("cedulaTitular").value.trim(),
    apto: document.getElementById("apto").value.trim().toUpperCase(),
    telefono: document.getElementById("telefono").value.trim(),
    correo: document.getElementById("correo").value.trim(),
    calidad: document.getElementById("calidad").value,
    numeroParqueadero: document.getElementById("numeroParqueadero").value.trim(),
    ubicacion: document.getElementById("ubicacion").value.trim(),
    tipoVehiculo: document.getElementById("tipoVehiculo").value,
    marcaLinea: document.getElementById("marcaLinea").value.trim(),
    placa: document.getElementById("placa").value.trim().toUpperCase(),
    color: document.getElementById("color").value.trim(),
    capacidadBateria: document.getElementById("capacidadBateria").value,
    potenciaCarga: document.getElementById("potenciaCarga").value,
    tipoConector: document.getElementById("tipoConector").value,
    nombreFirmante: document.getElementById("nombreFirmante").value.trim(),
    cedulaFirmante: document.getElementById("cedulaFirmante").value.trim(),
    aceptaHabeasData: document.getElementById("aceptaHabeasData").checked,
    aceptaReglamento: document.getElementById("aceptaReglamento").checked
  };

  // VALIDACIONES BÁSICAS EN CLIENTE

  if (datos.nombreTitular === "") {
    alert("Ingrese el nombre del titular");
    return;
  }

  if (datos.cedulaTitular === "") {
    alert("Ingrese la cédula / NIT del titular");
    return;
  }

  if (datos.apto === "") {
    alert("Ingrese el apartamento");
    return;
  }

  if (datos.telefono === "") {
    alert("Ingrese el teléfono de contacto");
    return;
  }

  if (datos.correo === "" || !correoValido(datos.correo)) {
    alert("Ingrese un correo electrónico válido");
    return;
  }

  if (datos.numeroParqueadero === "") {
    alert("Ingrese el número de parqueadero");
    return;
  }

  if (datos.marcaLinea === "") {
    alert("Ingrese la marca y línea del vehículo");
    return;
  }

  if (datos.placa === "") {
    alert("Ingrese la placa del vehículo");
    return;
  }

  let inputTarjeta = document.getElementById("anexoTarjetaPropiedad");
  let inputSoat = document.getElementById("anexoSoat");
  let inputTecnomecanica = document.getElementById("anexoTecnomecanica");
  let inputCertificacionElectrica = document.getElementById("anexoCertificacionElectrica");
  let inputCartaAutorizacion = document.getElementById("anexoCartaAutorizacion");
  let inputCompromisoReglamento = document.getElementById("anexoCompromisoReglamento");

  if (!inputTarjeta.files.length) {
    alert("Adjunte la copia de la tarjeta de propiedad del vehículo");
    return;
  }

  if (!inputSoat.files.length) {
    alert("Adjunte la copia del SOAT");
    return;
  }

  if (!inputTecnomecanica.files.length) {
    alert("Adjunte la copia de la certificación tecnomecánica");
    return;
  }

  if (!inputCertificacionElectrica.files.length) {
    alert("Adjunte la certificación de instalación eléctrica / ficha técnica del cargador");
    return;
  }

  if (datos.calidad === "Arrendatario / Tenedor" && !inputCartaAutorizacion.files.length) {
    alert("Al ser arrendatario, debe adjuntar la carta de autorización del propietario");
    return;
  }

  if (!inputCompromisoReglamento.files.length) {
    alert("Adjunte el compromiso firmado de cumplimiento del Reglamento Interno");
    return;
  }

  if (datos.nombreFirmante === "") {
    alert("Ingrese el nombre completo del firmante");
    return;
  }

  if (datos.cedulaFirmante === "") {
    alert("Ingrese la cédula / NIT del firmante");
    return;
  }

  if (!firmaTrazada) {
    alert("Falta la firma del solicitante");
    return;
  }

  if (!datos.aceptaHabeasData) {
    alert("Debe aceptar la cláusula de tratamiento de datos personales (Habeas Data)");
    return;
  }

  if (!datos.aceptaReglamento) {
    alert("Debe aceptar la declaración de compromiso y el Reglamento Interno");
    return;
  }

  let boton = document.getElementById("btnRegistrar");
  boton.disabled = true;
  boton.textContent = "Enviando...";

  Promise.all([
    convertirArchivoBase64(inputTarjeta),
    convertirArchivoBase64(inputSoat),
    convertirArchivoBase64(inputTecnomecanica),
    convertirArchivoBase64(inputCertificacionElectrica),
    convertirArchivoBase64(inputCartaAutorizacion),
    convertirArchivoBase64(inputCompromisoReglamento)
  ]).then(function (archivos) {
    datos.anexoTarjetaPropiedad = archivos[0];
    datos.anexoSoat = archivos[1];
    datos.anexoTecnomecanica = archivos[2];
    datos.anexoCertificacionElectrica = archivos[3];
    datos.anexoCartaAutorizacion = archivos[4];
    datos.anexoCompromisoReglamento = archivos[5];
    datos.firma = canvasFirma.toDataURL("image/png");

    google.script.run
      .withSuccessHandler(function (res) {
        boton.disabled = false;
        boton.textContent = "💾 Enviar Solicitud";

        if (res.success) {
          alert("✅ Solicitud registrada correctamente");
          mostrarFormulario();
        } else {
          alert(res.mensaje);
        }
      })
      .withFailureHandler(function (error) {
        boton.disabled = false;
        boton.textContent = "💾 Enviar Solicitud";
        alert("Error registrando la solicitud: " + error.message);
      })
      .registrarVehiculo(datos);
  });
}
